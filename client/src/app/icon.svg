<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#1e40af"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" ry="112" fill="#001D4D"/>
  
  <!-- Upward trend arrow -->
  <g transform="translate(50, 80) scale(3.2)">
    <path d="M 50 130 L 70 110 L 90 125 L 110 105 L 130 125" stroke="#FFD700" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="130 105 145 110 135 85" fill="#FFD700"/>
    
    <!-- Shop building -->
    <rect x="40" y="140" width="120" height="45" fill="#FFD700" rx="4"/>
    
    <!-- Store windows -->
    <rect x="50" y="150" width="25" height="25" fill="#1E40AF"/>
    <rect x="85" y="150" width="25" height="25" fill="#1E40AF"/>
    <rect x="120" y="150" width="25" height="25" fill="#1E40AF"/>
    
    <!-- Door -->
    <rect x="92" y="170" width="16" height="15" fill="#1E40AF" rx="2"/>
    <circle cx="105" cy="177.5" r="1.5" fill="#FFD700"/>
  </g>
</svg>
